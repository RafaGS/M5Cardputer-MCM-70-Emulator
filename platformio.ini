; MCM/70 Cardputer port
; ROM files remain user-supplied from the original distribution.

[platformio]
default_envs = m7-cardputer

[env]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
upload_speed = 1500000
monitor_speed = 115200
build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    M5Cardputer=https://github.com/m5stack/M5Cardputer#1.2.0

[env:m7-cardputer]
build_flags =
    ${env.build_flags}
    -DMCM_DEBUG_SERIAL=1
    -DMCM_DISPLAY_TEST_PATTERN=0
    -DMCM_HTTP_AP_SSID=\"MCM70-Cardputer\"
    -DMCM_HTTP_AP_PASSWORD=\"mcm70tape\"

[env:m6-cardputer]
build_flags =
    ${env.build_flags}
    -DMCM_DEBUG_SERIAL=1
    -DMCM_DISPLAY_TEST_PATTERN=0
    -DMCM_HTTP_AP_SSID=\"MCM70-Cardputer\"
    -DMCM_HTTP_AP_PASSWORD=\"mcm70tape\"

; Compatibility alias for the M5 firmware build target.
[env:m5-cardputer]
build_flags =
    ${env:m6-cardputer.build_flags}

[env:m5-cardputer-nodebug]
build_flags =
    ${env.build_flags}
    -DMCM_DEBUG_SERIAL=0
    -DMCM_DISPLAY_TEST_PATTERN=0

; Optional TFT mapping test. ROM upload is not needed. This build draws
; repeated 5x7 test glyphs in two rows and does not start the CPU on TAB.
[env:m5-cardputer-displaytest]
build_flags =
    ${env.build_flags}
    -DMCM_DEBUG_SERIAL=1
    -DMCM_DISPLAY_TEST_PATTERN=1
